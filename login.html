<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THREADS'26 | Secure Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --dark: #0f172a;
        }

        body {
            background-color: var(--dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: white;
            overflow: hidden;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-control {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.8rem 1.2rem;
            border-radius: 0.75rem;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            padding: 0.8rem;
            border-radius: 0.75rem;
            font-weight: 700;
        }

        .otp-input {
            letter-spacing: 0.5rem;
            font-size: 1.5rem;
            text-align: center;
            font-weight: 800;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="text-center mb-5">
            <div class="display-6 fw-bold text-primary mb-2">THREADS_26</div>
            <p class="text-muted small fw-medium">SUPER ADMIN ACCESS NODE</p>
        </div>

        <!-- Step 1: Send OTP -->
        <div id="stepEmail">
            <label class="form-label small text-muted text-uppercase fw-bold">Admin Email Address</label>
            <input type="email" id="adminEmail" class="form-control mb-4" placeholder="name@example.com">
            <button class="btn btn-primary w-100" id="btnSend" onclick="sendAdminOTP()">
                <i class="bi bi-shield-lock me-2"></i> Request Access Key
            </button>
        </div>

        <!-- Step 2: Verify OTP -->
        <div id="stepOTP" style="display: none;">
            <p class="small text-muted mb-4">An encrypted key was sent to <strong id="displayEmail"
                    class="text-white"></strong>. Enter it below to authorize.</p>
            <label class="form-label small text-muted text-uppercase fw-bold">Verification Key</label>
            <input type="text" id="adminOTP" class="form-control mb-4 otp-input" maxlength="6" placeholder="000000">
            <button class="btn btn-primary w-100 mb-3" id="btnVerify" onclick="verifyAdminOTP()">
                <i class="bi bi-unlock-fill me-2"></i> Authorize Session
            </button>
            <button class="btn btn-link w-100 text-muted text-decoration-none small" onclick="location.reload()">
                Back to Email
            </button>
        </div>

        <div id="loader" class="text-center mt-4" style="display: none;">
            <div class="spinner-border text-primary spinner-border-sm"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://threads26-2-fdem.onrender.com/api';
        const API_KEY = '7f8e3a1b9c4d2e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f';

        async function sendAdminOTP() {
            const rawEmail = document.getElementById('adminEmail').value.trim();
            if (!rawEmail) return alert("Enter email");

            const email = rawEmail.toLowerCase();

            toggleLoader(true);
            try {
                const res = await fetch(`${API_BASE}/admin/login-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('stepEmail').style.display = 'none';
                    document.getElementById('stepOTP').style.display = 'block';
                    document.getElementById('displayEmail').textContent = email;
                    document.getElementById('adminOTP').focus();
                } else {
                    alert(data.error || "Access Denied");
                }
            } catch (e) { alert("Server connectivity issue"); }
            toggleLoader(false);
        }

        async function verifyAdminOTP() {
            const email = document.getElementById('displayEmail').textContent.trim().toLowerCase();
            const otp = document.getElementById('adminOTP').value.trim();
            if (!otp) return alert("Enter 6-digit OTP");

            toggleLoader(true);
            try {
                const res = await fetch(`${API_BASE}/admin/login-verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                    body: JSON.stringify({ email, otp: otp.toString() })
                });
                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('threads_admin_token', data.token);
                    window.location.href = 'super.html';
                } else {
                    alert(data.error || "Invalid or expired key");
                }
            } catch (e) { alert("Verification failed"); }
            toggleLoader(false);
        }

        function toggleLoader(show) {
            document.getElementById('loader').style.display = show ? 'block' : 'none';
            document.getElementById('btnSend').disabled = show;
            document.getElementById('btnVerify').disabled = show;
        }
    </script>
</body>

</html>
