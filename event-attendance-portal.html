<!DOCTYPE html>
<html>
<head>
    <title>Event Attendance Portal · Mobile</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <style>
        /* === OPTIMIZED FOR MOBILE · same core DNA, leaner & touch friendly === */
        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #e0e7ff;
            --secondary: #10b981;
            --bg: #f3f4f6;
            --card: rgba(255, 255, 255, 0.95);
            --text-main: #1f2937;
            --text-dim: #6b7280;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow: 0 4px 10px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.03);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f3f4f6 0%, #e5e7eb 100%);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 600px;  /* comfortable mobile width */
            margin: 0 auto;
        }

        /* header compact + readable */
        .portal-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 16px 18px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
        }

        .portal-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.3;
            word-break: break-word;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
            transition: all 0.2s ease;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0.5; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .section-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
        }

        /* buttons: bigger touch targets, less visual noise */
        .btn {
            padding: 12px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            border: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            outline: none;
            background: white;
            color: var(--text-main);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            border: 1px solid #eef2f6;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            box-shadow: 0 6px 12px rgba(99,102,241,0.25);
        }

        .btn-ghost {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: none;
        }

        .btn-export {
            background: #10b981;
            color: white;
            border: none;
        }

        /* stats grid — scrollable on very small if needed, but wraps */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .stat-item {
            background: white;
            padding: 16px 12px;
            border-radius: 20px;
            border: 1px solid #f0f2f5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-bottom: 6px;
        }

        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 1.7rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-main);
        }

        /* scanner section */
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 12px;
            border-radius: 28px;
            overflow: hidden;
            border: 3px solid white;
            box-shadow: var(--shadow);
            background: #000; /* fallback */
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .input-group input {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid transparent;
            background: #f9fafc;
            border-radius: 24px;
            font-size: 1rem;
            transition: 0.15s;
            -webkit-appearance: none;
            appearance: none;
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
            outline: none;
        }

        /* result box */
        .result-box {
            margin-top: 20px;
            padding: 18px;
            border-radius: 24px;
            font-size: 0.95rem;
            border-left: 6px solid var(--primary);
            background: white;
            box-shadow: 0 6px 14px rgba(0,0,0,0.02);
            word-break: break-word;
        }

        /* table responsive */
        .table-container {
            overflow-x: auto;
            border-radius: 20px;
            background: white;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px; /* ensures columns readable, scrolls on small */
        }

        th {
            background: #f9fafb;
            padding: 14px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dim);
        }

        td {
            padding: 14px 12px;
            font-size: 0.9rem;
            border-bottom: 1px solid #f0f2f5;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            white-space: nowrap;
        }

        /* search bar */
        .search-container {
            flex: 1 1 200px;
            min-width: 160px;
        }

        #searchBox {
            width: 100%;
            padding: 14px 16px;
            border-radius: 40px;
            border: 1px solid #e2e6ea;
            font-size: 0.95rem;
            background: white;
        }

        /* stacked buttons on mobile */
        .section-header .btn,
        .portal-header .btn {
            padding: 10px 16px;
            font-size: 0.85rem;
        }

        /* small helper */
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        /* reduce extra whitespace */
        .stats.card {
            padding: 18px 16px;
        }

        /* improved hint card */
        .manual-hint {
            margin-top: 24px;
            padding: 18px;
            background: #eff6ff;
            border-radius: 22px;
            border: 1px dashed #bfdbfe;
            font-size: 0.9rem;
        }

        /* last updated inline */
        #lastUpdated {
            font-size: 0.7rem;
            color: var(--text-dim);
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .portal-header h1 {
                font-size: 1.2rem;
            }
            .stat-value {
                font-size: 1.5rem;
            }
            .btn {
                padding: 10px 14px;
            }
            .section-header h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="portal-header">
        <h1 id="eventTitle">Event Attendance Portal</h1>
        <div class="flex-row" style="gap: 8px;">
            <button class="btn btn-ghost" onclick="window.close()" style="background:#f1f3f5;">✕ Exit</button>
        </div>
    </div>

    <!-- stats card (compact) -->
    <div class="stats card">
        <div class="section-header" style="margin-bottom: 12px;">
            <h2 style="font-size:1.2rem;">📊 Live Stats</h2>
            <div id="lastUpdated" style="font-size:0.7rem;"></div>
        </div>
        <div class="stats-grid">
            <div class="stat-item"><div class="stat-label">Total</div><div class="stat-value" id="totalRegistered">0</div></div>
            <div class="stat-item"><div class="stat-label">✅ Verified</div><div class="stat-value" id="verifiedCount">0</div></div>
            <div class="stat-item"><div class="stat-label">🔥 Present</div><div class="stat-value" id="presentCount">0</div></div>
            <div class="stat-item"><div class="stat-label">💤 Absent</div><div class="stat-value" id="absentCount">0</div></div>
            <div class="stat-item"><div class="stat-label">📈 Rate</div><div class="stat-value" id="attendancePercent">0%</div></div>
        </div>
    </div>

    <!-- main action grid: scanner + manual (stacked) -->
    <div style="display: flex; flex-direction: column; gap: 20px;">
        <!-- QR SCANNER CARD -->
        <div id="qr-section" class="section active card" style="padding-bottom: 16px;">
            <div class="section-header">
                <h2>📱 QR Scanner</h2>
                <button class="btn btn-ghost" onclick="switchToManual()">⌨️ Manual</button>
            </div>
            <p style="font-size:0.9rem; margin-bottom:16px;">Point camera at QR code</p>
            <div id="reader"></div>
            <div style="display: flex; justify-content: center; gap: 12px; margin: 18px 0 6px;">
                <button class="btn btn-primary" onclick="startScanner()">▶ Start</button>
                <button class="btn" style="background:#fee2e2; color:#991b1b;" onclick="stopScanner()">⏹ Stop</button>
            </div>
            <div id="scanResult"></div>
        </div>

        <!-- MANUAL SECTION (hidden by default) -->
        <div id="manual-section" class="section card">
            <div class="section-header">
                <h2>✏️ Manual</h2>
                <button class="btn btn-ghost" onclick="switchToQR()">📷 Scan</button>
            </div>
            <p style="font-size:0.9rem; margin-bottom:16px;">Enter participant ID</p>
            <div class="input-group">
                <label>Participant ID</label>
                <input type="text" id="participantIdInput" placeholder="e.g. 1024" inputmode="numeric" autocomplete="off" onkeypress="if(event.key === 'Enter') markManualAttendance()">
            </div>
            <button class="btn btn-primary" style="width:100%; padding:16px;" onclick="markManualAttendance()">✔ Mark attendance</button>
            <div id="manualResult"></div>
            <div class="manual-hint">
                <strong>💡 Tip:</strong> Type ID and press <kbd style="background:#ddd; padding:2px 8px; border-radius:30px;">Enter</kbd> — quick check-in.
            </div>
        </div>
    </div>

    <!-- Registrations Table Card -->
    <div class="card" style="margin-top: 8px;">
        <div class="section-header">
            <h2 style="font-size:1.2rem;">👥 Registrations</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end;">
                <div class="search-container">
                    <input id="searchBox" placeholder="Search..." onkeyup="filterRegistrations()">
                </div>
                <div style="display: flex; gap: 6px; width: 100%; justify-content: flex-end;">
                    <button class="btn btn-export" style="padding:10px 14px; flex:1;" onclick="exportToCSV(false)">📥 All</button>
                    <button class="btn btn-export" style="background:var(--primary-dark); padding:10px 14px; flex:1;" onclick="exportToCSV(true)">✅ Verified</button>
                    <button class="btn btn-ghost" style="padding:10px 14px;" onclick="refreshRegistrations()">↻</button>
                </div>
            </div>
        </div>
        <div id="registrationsContainer"></div>
    </div>
</div>

<script>
    (function() {
        // --- constants & globals ---
        const BASE_URL = 'https://threads26-2-fdem.onrender.com';
        const API_KEY = '7f8e3a1b9c4d2e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f';
        let token = localStorage.getItem('coordinatorToken');
        let eventId = localStorage.getItem('currentEventId');
        let eventName = localStorage.getItem('currentEventName');

        let allRegistrations = [];
        let html5QrCode;
        let scanning = false;

        // --- init ---
        window.onload = () => {
            if (!token || !eventId) {
                alert('Login required');
                window.close();
                return;
            }
            document.getElementById('eventTitle').innerText = `${eventName || 'Event'} · Attendance`;
            loadEventRegistrations();
            startScanner();

            document.getElementById('participantIdInput').addEventListener('focus', function() {
                this.select();
            });
        };

        // --- switch sections ---
        window.switchToManual = function() {
            stopScanner();
            document.getElementById('qr-section').classList.remove('active');
            document.getElementById('manual-section').classList.add('active');
            document.getElementById('participantIdInput').focus();
        };

        window.switchToQR = function() {
            document.getElementById('manual-section').classList.remove('active');
            document.getElementById('qr-section').classList.add('active');
            startScanner();
        };

        // --- scanner ---
        window.startScanner = function() {
            if (scanning) return;
            html5QrCode = new Html5Qrcode("reader");
            scanning = true;
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 15, qrbox: 260 },
                onScanSuccess,
                () => {}
            ).catch(() => { scanning = false; });
        };

        window.stopScanner = function() {
            if (html5QrCode && scanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    scanning = false;
                }).catch(() => {});
            }
        };

        async function onScanSuccess(decodedText) {
            stopScanner();
            const scanDiv = document.getElementById('scanResult');
            scanDiv.innerHTML = '<div class="result-box">⚡ Processing QR...</div>';

            try {
                const qrData = JSON.parse(decodedText);
                let registrationIds = [];

                if (qrData.ids) {
                    registrationIds = qrData.ids.split('|');
                } else if (qrData.registration_ids) {
                    registrationIds = qrData.registration_ids;
                } else {
                    registrationIds = [decodedText];
                }

                if (registrationIds.length === 0) throw new Error('No IDs');

                // filter for current event
                const validIds = registrationIds.filter(id => {
                    try {
                        if (!id.startsWith('THREADS26-')) return false;
                        const parts = id.split('-');
                        return parts[parts.length-1] === String(eventId);
                    } catch { return false; }
                });

                if (validIds.length === 0) {
                    scanDiv.innerHTML = '<div class="result-box error">❌ No valid registration for this event</div>';
                    setTimeout(startScanner, 1500);
                    return;
                }

                if (validIds.length > 5) {
                    scanDiv.innerHTML = `<div class="result-box warning">📌 ${validIds.length} registrations. Using first.</div>`;
                }

                const primaryId = validIds[0];
                const res = await fetch(`${BASE_URL}/api/scan-attendance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                    body: JSON.stringify({ registration_id: primaryId, qr_data: qrData })
                });

                const data = await res.json();

                if (data.success) {
                    let resultHtml = `<div class="result-box success">✅ <strong>Marked!</strong><br><small>${data.participant?.full_name || ''}</small><br><small>${data.message || ''}</small>`;
                    if (validIds.length > 1) resultHtml += `<br><small>📌 QR: ${validIds.length} total</small>`;
                    if (data.year_of_study) resultHtml += `<br><small>Year: ${data.year_of_study}</small>`;
                    resultHtml += `</div>`;
                    scanDiv.innerHTML = resultHtml;

                    const reg = allRegistrations.find(x => x.registration_unique_id === primaryId);
                    if (reg) reg.attendance_status = 'ATTENDED';
                } else {
                    scanDiv.innerHTML = `<div class="result-box error">❌ ${data.message || 'failed'}<br>${data.suggestion ? `<small>💡 ${data.suggestion}</small>` : ''}</div>`;
                }
            } catch (e) {
                scanDiv.innerHTML = `<div class="result-box error">❌ Error: ${e.message}</div>`;
            }

            updateStats();
            filterRegistrations();
            setTimeout(() => { scanDiv.innerHTML = ''; startScanner(); }, 2000);
        }

        // --- manual attendance ---
        window.markManualAttendance = async function() {
            const pid = document.getElementById('participantIdInput').value.trim();
            const resultDiv = document.getElementById('manualResult');
            if (!pid) {
                resultDiv.innerHTML = '<div class="result-box error">Enter ID</div>';
                return;
            }
            resultDiv.innerHTML = '<div class="result-box">Processing...</div>';

            try {
                const res = await fetch(`${BASE_URL}/api/manual-attendance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                    body: JSON.stringify({ participant_id: pid, event_id: eventId })
                });
                const data = await res.json();

                if (data.success) {
                    resultDiv.innerHTML = `<div class="result-box success">✅ <strong>Marked</strong><br><small>${data.participant?.full_name || ''}</small><br><small>${data.message || ''}</small></div>`;
                    const r = allRegistrations.find(x => x.participant_id == pid && x.event_id == eventId);
                    if (r) { r.attendance_status = 'ATTENDED'; r.verification_status = data.payment_info?.admin_verified ? 'Verified' : 'Pending'; }
                    updateStats(); filterRegistrations();
                    document.getElementById('participantIdInput').value = '';
                    document.getElementById('participantIdInput').focus();
                } else {
                    resultDiv.innerHTML = `<div class="result-box error">❌ ${data.message || 'failed'}<br>${data.suggestion ? `<small>💡 ${data.suggestion}</small>` : ''}</div>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="result-box error">❌ Error: ${e.message}</div>`;
            }
        };

        // --- load data ---
        async function loadEventRegistrations() {
            try {
                const res = await fetch(`${BASE_URL}/api/admin/registrations?event_id=${eventId}`, {
                    headers: { 'x-api-key': API_KEY }
                });
                if (!res.ok) throw new Error('Failed');
                allRegistrations = await res.json();
                displayRegistrations(allRegistrations);
                updateStats();
            } catch (e) {
                alert('Could not load registrations');
            }
        }

        function displayRegistrations(list) {
            if (!list.length) {
                document.getElementById('registrationsContainer').innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-dim);">No registrations</div>';
                return;
            }
            const sorted = [...list].sort((a,b) => {
                const aV = a.verified_by_admin === true;
                const bV = b.verified_by_admin === true;
                if (aV && !bV) return -1;
                if (!aV && bV) return 1;
                return (a.full_name || '').localeCompare(b.full_name || '');
            });

            let html = `<div class="table-container"><table><thead><tr><th>Name</th><th>ID / College</th><th>Verif</th><th>Attend</th></tr></thead><tbody>`;
            sorted.forEach(r => {
                const present = r.attendance_status === 'ATTENDED';
                const verified = r.verified_by_admin === true;
                html += `<tr>
                    <td><div style="font-weight:600;">${r.full_name || '?'}</div><div style="font-size:0.7rem;color:var(--text-dim);">${r.email || ''}</div></td>
                    <td><code style="background:var(--primary-light);padding:3px 6px;border-radius:20px;">#${r.participant_id || ''}</code><div style="font-size:0.7rem;">${(r.college_name || '').substring(0,20)}</div></td>
                    <td><span class="badge ${verified ? 'badge-success' : 'badge-pending'}">${verified ? '✔' : '○'}</span></td>
                    <td><span class="badge ${present ? 'badge-attended' : 'badge-error'}">${present ? '✅' : '⌛'}</span></td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            document.getElementById('registrationsContainer').innerHTML = html;
        }

        function updateStats() {
            const total = allRegistrations.length;
            const present = allRegistrations.filter(r => r.attendance_status === 'ATTENDED').length;
            const verified = allRegistrations.filter(r => r.verified_by_admin === true).length;
            document.getElementById('totalRegistered').innerText = total;
            document.getElementById('presentCount').innerText = present;
            document.getElementById('verifiedCount').innerText = verified;
            document.getElementById('absentCount').innerText = total - present;
            const percent = total ? ((present/total)*100).toFixed(1) : 0;
            document.getElementById('attendancePercent').innerText = percent + '%';
            document.getElementById('lastUpdated').innerText = `🕒 ${new Date().toLocaleTimeString()}`;
        }

        window.filterRegistrations = function() {
            const q = document.getElementById('searchBox').value.toLowerCase().trim();
            if (!q) return displayRegistrations(allRegistrations);
            const filtered = allRegistrations.filter(r => 
                (r.full_name && r.full_name.toLowerCase().includes(q)) ||
                (r.participant_id && r.participant_id.toString().includes(q)) ||
                (r.college_name && r.college_name.toLowerCase().includes(q)) ||
                (r.email && r.email.toLowerCase().includes(q))
            );
            displayRegistrations(filtered);
        };

        window.refreshRegistrations = function() {
            document.getElementById('searchBox').value = '';
            loadEventRegistrations();
        };

        // export unchanged (function preserved, just rebind)
        window.exportToCSV = function(onlyVerified = false) {
            let dataToExport = [...allRegistrations];
            if (onlyVerified) dataToExport = dataToExport.filter(r => r.verified_by_admin === true);
            if (!dataToExport.length) { alert('No data'); return; }

            const eventFolderName = (eventName || 'event').replace(/[^a-z0-9]/gi, '_').toLowerCase();
            const suffix = onlyVerified ? '_verified' : '_all';
            const filename = `${eventFolderName}${suffix}_${new Date().toISOString().split('T')[0]}.csv`;

            const headers = ["Name","Participant ID","College","Email","Phone","Payment","Verification","Attendance"];
            const sorted = dataToExport.sort((a,b) => {
                const aV = a.verified_by_admin === true;
                const bV = b.verified_by_admin === true;
                if (aV && !bV) return -1;
                if (!aV && bV) return 1;
                return (a.full_name || '').localeCompare(b.full_name || '');
            });

            const rows = sorted.map(r => [
                `"${r.full_name || ''}"`, `"${r.participant_id || ''}"`, `"${r.college_name || ''}"`,
                `"${r.email || ''}"`, `"${r.phone_number || ''}"`, `"${r.payment_status || 'N/A'}"`,
                `"${r.verified_by_admin === true ? 'Verified' : 'Pending'}"`, `"${r.attendance_status || 'PENDING'}"`
            ]);
            const csv = [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
            const blob = new Blob([csv], {type: 'text/csv'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        };

        window.addEventListener('beforeunload', () => { if (scanning) stopScanner(); });
    })();
</script>
</body>
</html>
